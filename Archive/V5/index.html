<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coins 01 — Coin Combos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div class="app">
  <div class="top">
    <h1>🪙 Coin Combos</h1>
    <nav class="ptabs" aria-label="Coin activities">
      <button class="on" data-act="page" data-arg="coins">Coin Combinations</button>
      <button data-act="page" data-arg="crystals">Crystal Garden</button>
      <button data-act="page" data-arg="learn">Coin Club</button>
    </nav>
    <button class="gear" id="gear" data-act="settings">⚙ Settings</button>
  </div>
  <div class="bar" id="bar"></div>
  <div class="actions shared-actions"><div class="status" id="status"></div><span id="actions" style="display:contents"></span></div>
  <main class="main" id="coinPage">
    <div class="left">
      <div class="card tt"><div class="tray" id="tray" style="margin:0 0 8px"></div><svg id="tt" viewBox="0 0 440 420"></svg></div>
      <div id="predict"></div>
    </div>
    <div class="right">
      <div class="tabs" id="tabs"></div>
      <div id="panels"></div>
    </div>
  </main>
  <section class="pageview" id="crystalPage" hidden></section>
  <section class="pageview learn-page" id="learnPage" hidden></section>
</div>
<div class="tip" id="tip"></div>

<script src="js/core.js"></script>
<script src="js/table.js"></script>
<script src="js/views.js"></script>
<script src="js/strategies.js"></script>
<script src="js/crystals.js"></script>
<script src="js/learn.js"></script>
<script src="js/app.js"></script>
</body>
</html>
